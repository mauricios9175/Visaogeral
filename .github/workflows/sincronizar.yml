name: Sincronizar Meta Ads

# Puxa os dados automaticamente chamando o painel publicado.
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL      → endereço do painel (ex.: https://visaogeral.vercel.app)
#   CRON_SECRET  → o mesmo valor configurado na Vercel
on:
  schedule:
    - cron: "7 * * * *"   # a cada hora: hoje + ontem
    - cron: "17 6 * * *"  # 03:17 de Brasília: reprocessa últimos 7 dias
  workflow_dispatch:
    inputs:
      modo:
        description: "hoje, semana ou mes"
        default: "semana"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sincronizar Meta Ads
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '17 6 * * *' && 'semana') || 'hoje' }}
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync?modo=$MODO"

      # Notificações no celular com os alertas novos (o mesmo alerta não repete no dia)
      - name: Avisos no celular
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync?modo=avisos"

      # Google Ads: a cada 3 horas (cota do nível Explorer) e 30 dias de madrugada.
      - name: Sincronizar Google Ads
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NOITE: ${{ github.event.schedule == '17 6 * * *' }}
        run: |
          if [ "$NOITE" = "true" ]; then DIAS=30
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((10#$(date -u +%H) % 3)) -eq 0 ]; then DIAS=2
          else echo "Fora da janela de 3 horas, pulando."; exit 0; fi
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync?modo=google&dias=$DIAS"

      - name: Sincronizar CRMs
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DIAS: ${{ (github.event.schedule == '17 6 * * *' && '90') || '30' }}
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync?modo=crm&dias=$DIAS"

      # Histórico mensal (substitui a planilha): de madrugada, depois do CRM.
      - name: Atualizar histórico mensal
        if: always() && (github.event.schedule == '17 6 * * *' || github.event_name == 'workflow_dispatch')
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync?modo=historico"


  # Sugestões com IA de madrugada, só nos clientes com sinal de problema (depois da sincronização; job próprio
  # porque leva alguns minutos: cada chamada faz o que couber no tempo).
  sugestoes:
    needs: sync
    if: always() && (github.event.schedule == '17 6 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sugestões com IA
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in 1 2 3; do
            R=$(curl -sS --fail-with-body --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/sync?modo=sugestoes") || exit 1
            echo "$R"
            echo "$R" | grep -q '"restantes":0' && break
          done

      # Análise dos criativos com IA (os novos e os que ainda não têm), maiores gastos primeiro
      - name: Análise dos criativos
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in 1 2 3 4 5 6; do
            R=$(curl -sS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/sync?modo=criativos") || break
            echo "$R"
            echo "$R" | grep -q '"restantes":0' && break
            echo "$R" | grep -qi 'limite' && break
          done
